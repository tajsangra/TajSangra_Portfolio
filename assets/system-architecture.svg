<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Keyboard system architecture</title>
<desc id="desc">RP2040-based keyboard architecture with key matrix, RGB chain, OLED and rotary encoder expansion provisions, and USB connection.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#647789"/></marker>
</defs>
<rect width="1100" height="520" rx="30" fill="#0b0f14"/>
<g font-family="Inter,system-ui,sans-serif">
  <rect x="410" y="185" width="280" height="150" rx="22" fill="#111c26" stroke="#7ee787" stroke-width="2"/>
  <text x="550" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="#eef4fa">Raspberry Pi Pico</text>
  <text x="550" y="270" text-anchor="middle" font-size="16" fill="#95a4b3">RP2040 controller</text>
  <text x="550" y="300" text-anchor="middle" font-size="14" fill="#6f8191">QMK firmware · USB HID</text>

  <rect x="70" y="70" width="260" height="120" rx="18" fill="#111c26" stroke="#d8e2ec" stroke-width="1.5"/>
  <text x="200" y="118" text-anchor="middle" font-size="19" font-weight="650" fill="#eef4fa">84-key matrix</text>
  <text x="200" y="148" text-anchor="middle" font-size="14" fill="#95a4b3">9 rows × 10 columns</text>
  <text x="200" y="170" text-anchor="middle" font-size="13" fill="#6f8191">diode-isolated switches</text>

  <rect x="70" y="325" width="260" height="120" rx="18" fill="#111c26" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="200" y="373" text-anchor="middle" font-size="19" font-weight="650" fill="#eef4fa">RGB chain</text>
  <text x="200" y="403" text-anchor="middle" font-size="14" fill="#95a4b3">92 × SK6812MINI-E</text>
  <text x="200" y="425" text-anchor="middle" font-size="13" fill="#6f8191">level-shifted data path</text>

  <rect x="770" y="70" width="260" height="120" rx="18" fill="#111c26" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="900" y="118" text-anchor="middle" font-size="19" font-weight="650" fill="#eef4fa">OLED provision</text>
  <text x="900" y="148" text-anchor="middle" font-size="14" fill="#95a4b3">display footprint + header</text>
  <text x="900" y="170" text-anchor="middle" font-size="13" fill="#6f8191">expansion hardware</text>

  <rect x="770" y="325" width="260" height="120" rx="18" fill="#111c26" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="900" y="373" text-anchor="middle" font-size="19" font-weight="650" fill="#eef4fa">Encoder provision</text>
  <text x="900" y="403" text-anchor="middle" font-size="14" fill="#95a4b3">rotary input footprint</text>
  <text x="900" y="425" text-anchor="middle" font-size="13" fill="#6f8191">media/control expansion</text>

  <line x1="330" y1="130" x2="410" y2="215" stroke="#647789" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="385" x2="410" y2="305" stroke="#647789" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="215" x2="770" y2="130" stroke="#647789" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="305" x2="770" y2="385" stroke="#647789" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="457" y="390" width="186" height="62" rx="14" fill="#111c26" stroke="#ffa657" stroke-width="1.5"/>
  <text x="550" y="428" text-anchor="middle" font-size="16" font-weight="650" fill="#eef4fa">USB → computer</text>
  <line x1="550" y1="335" x2="550" y2="390" stroke="#647789" stroke-width="2" marker-end="url(#arrow)"/>
</g>
</svg>
